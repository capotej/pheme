name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json
          ini-values: error_reporting=E_ALL

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y guile-3.0 guile-3.0-dev autoconf build-essential pkg-config valgrind

      - name: Build extension
        run: |
          phpize
          ./configure --enable-pheme
          make

      - name: Run tests
        run: make test TESTS=tests/ NO_INTERACTION=1

      - name: Run tests with valgrind
        env:
          TEST_PHP_SRCDIR: ${{ github.workspace }}
        run: |
          echo > tmp-php.ini
          php run-tests.php -n -c tmp-php.ini -d extension_dir=modules/ -d extension=pheme --show-diff -p1 -P -m tests/

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/*.diff
            tests/*.exp
            tests/*.log
            tests/*.out

      - name: Upload valgrind logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-logs
          path: tests/*.mem
